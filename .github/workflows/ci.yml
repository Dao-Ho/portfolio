name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Lint, format, type check and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              id: install
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            # Still run after an earlier check fails, so one run reports every problem.
            - name: Check formatting
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npm run format:check

            - name: Run TypeScript compiler
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: npx tsc --noEmit

            - uses: actions/cache@v6
              with:
                  path: ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', '*.config.*') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Build
              run: npm run build
